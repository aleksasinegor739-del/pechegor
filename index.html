
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hamster Clicker</title>
<style>
body {
  margin: 0;
  background: linear-gradient(135deg,#25144c,#7046a5);
  color: white;
  font-family: Arial;
  text-align: center;
  padding: 25px 10px;
}
h1 { color: #ffd65c; }
.stats {
  background: #ffffff20;
  border-radius: 18px;
  padding: 15px;
  margin: 15px auto;
  max-width: 350px;
}
#hamster {
  font-size: 120px;
  background: transparent;
  border: none;
  cursor: pointer;
  transition: transform .1s;
}
#hamster:active { transform: scale(.85); }
button {
  border: none;
  border-radius: 14px;
  padding: 13px 20px;
  margin: 6px;
  font-size: 17px;
  font-weight: bold;
  cursor: pointer;
  background: #ffc94d;
  color: #39214f;
}
.shop {
  background: #ffffff20;
  border-radius: 18px;
  padding: 15px;
  max-width: 350px;
  margin: 20px auto;
}
.bar {
  background: #555;
  border-radius: 20px;
  overflow: hidden;
  height: 15px;
}
#energyBar {
  background: #ffbd35;
  width: 100%;
  height: 100%;
}
</style>
</head>
<body>

<h1>🐹 HAMSTER CLICKER</h1>

<div class="stats">
  <h2>🪙 Монеты: <span id="coins">0</span></h2>
  <h3>👆 За тап: <span id="power">1</span></h3>
  <h3>⚡ Энергия: <span id="energy">1000</span></h3>
  <div class="bar">
    <div id="energyBar"></div>
  </div>
</div>

<button id="hamster">🐹</button>
<p>Нажимай на хомячка!</p>

<div class="shop">
  <h2>🛒 МАГАЗИН</h2>
  <button onclick="upgrade()">👆 Улучшить тап (50)</button>
  <br>
  <button onclick="buyEnergy()">⚡ Купить энергию (100)</button>
</div>

<script>
let coins = Number(localStorage.getItem("coins")) || 0;
let power = Number(localStorage.getItem("power")) || 1;
let energy = Number(localStorage.getItem("energy")) || 1000;
let maxEnergy = 1000;
let cost = Number(localStorage.getItem("cost")) || 50;

const $ = id => document.getElementById(id);

function save() {
  localStorage.setItem("coins", coins);
  localStorage.setItem("power", power);
  localStorage.setItem("energy", energy);
  localStorage.setItem("cost", cost);
}

function update() {
  $("coins").textContent = coins;
  $("power").textContent = power;
  $("energy").textContent = energy;
  $("energyBar").style.width =
    (energy / maxEnergy * 100) + "%";
  save();
}

$("hamster").onclick = function() {
  if (energy < 1) return;
  coins += power;
  energy--;
  update();
};

function upgrade() {
  if (coins < cost) return;
  coins -= cost;
  power++;
  cost = Math.ceil(cost * 1.6);
  update();
}

function buyEnergy() {
  if (coins < 100) return;
  coins -= 100;
  energy = Math.min(maxEnergy, energy + 250);
  update();
}

setInterval(() => {
  if (energy < maxEnergy) {
    energy = Math.min(maxEnergy, energy + 2);
    update();
  }
}, 1000);

update();
</script>

</body>
</html>
