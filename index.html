
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Печегор 3D</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:Arial;background:#8cc9e8}
canvas{display:block}
#hud{position:fixed;top:8px;left:8px;z-index:2;background:#17251de8;color:white;padding:10px;border-radius:12px;width:175px;font-size:12px}
#money{font-size:17px;color:#ffdf75;font-weight:bold}
.stat{margin-top:6px}
.track{height:7px;background:#455448;border-radius:8px;overflow:hidden}
.fill{height:100%;background:#70d879;width:100%}
#message{position:fixed;top:8px;left:50%;transform:translateX(-50%);z-index:3;background:#17251de8;color:white;padding:9px;border-radius:10px;font-size:12px;text-align:center}
#joystick{position:fixed;left:20px;bottom:20px;width:130px;height:130px;border-radius:50%;background:#ffffff55;border:3px solid #ffffffaa;z-index:4;touch-action:none}
#stick{position:absolute;left:50%;top:50%;width:55px;height:55px;transform:translate(-50%,-50%);border-radius:50%;background:#f1c76c;border:3px solid white;pointer-events:none}
#actions{position:fixed;right:8px;bottom:12px;z-index:4;display:grid;grid-template-columns:repeat(2,85px);gap:6px}
button{border:0;border-radius:10px;padding:10px 5px;background:#e9bd65;color:#29251c;font-weight:bold;font-size:12px}
#modal{display:none;position:fixed;inset:0;z-index:10;background:#000a;align-items:center;justify-content:center;padding:12px}
#box{background:#293d30;color:white;border-radius:15px;padding:18px;width:min(370px,95vw);text-align:center}
#modalButtons{display:flex;flex-wrap:wrap;gap:7px;justify-content:center;margin:12px}
@media(max-height:430px){
 #joystick{width:105px;height:105px;bottom:10px}
 #stick{width:45px;height:45px}
 #actions{grid-template-columns:repeat(2,75px);bottom:5px}
 button{padding:7px 3px;font-size:10px}
}
</style>
</head>
<body>

<div id="hud">
 <div id="money">💰 1000 ₽</div>
 <div class="stat">⚡ Выносливость: <b id="energyText">100</b><div class="track"><div class="fill" id="energyBar"></div></div></div>
 <div class="stat">🍗 Голод: <b id="hungerText">100</b><div class="track"><div class="fill" id="hungerBar"></div></div></div>
 <div class="stat">😊 Счастье: <b id="happyText">70</b><div class="track"><div class="fill" id="happyBar"></div></div></div>
</div>

<div id="message">Добро пожаловать в Печегор!</div>

<div id="joystick"><div id="stick"></div></div>

<div id="actions">
 <button onclick="work()">💼 Работа</button>
 <button onclick="eat()">🍞 Поесть</button>
 <button onclick="rest()">🛏 Отдых</button>
 <button onclick="walk()">🌳 Прогулка</button>
 <button onclick="shop()">🛒 Магазин</button>
 <button onclick="casino()">🎰 Казино</button>
 <button onclick="interact()">🚪 Войти</button>
</div>

<div id="modal">
 <div id="box">
  <h2 id="modalTitle"></h2>
  <p id="modalText"></p>
  <div id="modalButtons"></div>
  <button onclick="closeModal()">Закрыть</button>
 </div>
</div>

<script type="importmap">
{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js"}}
</script>

<script type="module">
import * as THREE from "three";

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x9bd5ed);
scene.fog=new THREE.Fog(0x9bd5ed,45,110);

const camera=new THREE.PerspectiveCamera(65,innerWidth/innerHeight,.1,200);
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));
renderer.shadowMap.enabled=true;
document.body.prepend(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xffffff,0x557044,2));
const sun=new THREE.DirectionalLight(0xffffff,1.7);
sun.position.set(-20,30,15);
sun.castShadow=true;
scene.add(sun);

const material=c=>new THREE.MeshStandardMaterial({color:c});
function cube(w,h,d,color,x,y,z){
 const o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),material(color));
 o.position.set(x,y,z);
 o.castShadow=true;o.receiveShadow=true;
 scene.add(o);return o;
}

// Земля
cube(120,.3,120,0x65a94d,0,-.2,0);
cube(7,.08,100,0xc6ad7d,0,0,0);
cube(100,.08,7,0xc6ad7d,0,.01,0);

// Озеро
const water=cube(17,.15,12,0x379bc9,18,.02,-17);

// Дома
const buildings=[];
function house(name,x,z,color){
 cube(8,5,7,color,x,2.5,z);
 const roof=cube(9,1,8,0x8c4332,x,5.5,z);
 roof.rotation.z=.12;
 cube(1.5,2.5,.2,0x553622,x,1.25,z+3.61);
 buildings.push({name,x,z});
}
house("Дом",-13,-12,0xd9bd8c);
house("Магазин",12,8,0xd9a85e);
house("Ратуша",-13,12,0xd8d8c8);
house("Казино",14,-5,0xb77bc4);

// Деревья
for(let i=0;i<35;i++){
 const x=Math.random()*90-45;
 const z=Math.random()*90-45;
 if(Math.abs(x)<8&&Math.abs(z)<8)continue;
 cube(.6,2,.6,0x704329,x,1,z);
 const crown=new THREE.Mesh(
  new THREE.SphereGeometry(1.5,8,8),
  material(0x287b3d)
 );
 crown.position.set(x,3,z);
 scene.add(crown);
}

// Персонаж
const player=new THREE.Group();
const body=new THREE.Mesh(new THREE.CapsuleGeometry(.55,.9,4,8),material(0x3159bb));
body.position.y=1.1;
player.add(body);
const head=new THREE.Mesh(new THREE.SphereGeometry(.42,12,12),material(0xf0c69b));
head.position.y=2;
player.add(head);
scene.add(player);
player.position.set(0,0,5);

// Состояние
let money=1000,energy=100,hunger=100,happy=70;
let joyX=0,joyY=0;
const keys={};
let currentPlace="Деревня";

function updateHUD(){
 document.getElementById("money").textContent="💰 "+money+" ₽";
 for(const [id,value] of [["energy",energy],["hunger",hunger],["happy",happy]]){
  document.getElementById(id+"Text").textContent=Math.round(value);
  document.getElementById(id+"Bar").style.width=value+"%";
 }
}
function say(t){
 document.getElementById("message").textContent=t;
}
function spend(amount){
 if(money<amount){say("Недостаточно денег!");return false}
 money-=amount;updateHUD();return true;
}

// Джойстик
const joystick=document.getElementById("joystick");
const stick=document.getElementById("stick");
let activePointer=null;

function moveStick(e){
 const r=joystick.getBoundingClientRect();
 let x=e.clientX-(r.left+r.width/2);
 let y=e.clientY-(r.top+r.height/2);
 const max=36,d=Math.hypot(x,y);
 if(d>max){x=x/d*max;y=y/d*max}
 joyX=x/max;joyY=y/max;
 stick.style.left=`calc(50% + ${x}px)`;
 stick.style.top=`calc(50% + ${y}px)`;
}
function stopStick(){
 activePointer=null;joyX=0;joyY=0;
 stick.style.left="50%";stick.style.top="50%";
}
joystick.addEventListener("pointerdown",e=>{
 activePointer=e.pointerId;
 joystick.setPointerCapture(e.pointerId);
 moveStick(e);
});
joystick.addEventListener("pointermove",e=>{
 if(e.pointerId===activePointer)moveStick(e);
});
joystick.addEventListener("pointerup",stopStick);
joystick.addEventListener("pointercancel",stopStick);
joystick.addEventListener("lostpointercapture",stopStick);

// Клавиатура
window.addEventListener("keydown",e=>{
 keys[e.key.toLowerCase()]=true;
});
window.addEventListener("keyup",e=>{
 keys[e.key.toLowerCase()]=false;
});

// Действия
window.work=()=>{
 if(energy<20||hunger<10){say("Нужно отдохнуть или поесть!");return}
 money+=250;energy-=20;hunger-=10;
 say("Ты заработал 250 ₽!");
 updateHUD();
};
window.eat=()=>{
 if(!spend(100))return;
 hunger=Math.min(100,hunger+35);
 say("Ты перекусил!");
 updateHUD();
};
window.rest=()=>{
 energy=Math.min(100,energy+35);
 happy=Math.min(100,happy+10);
 say("Ты отдохнул.");
 updateHUD();
};
window.walk=()=>{
 if(energy<10){say("Не хватает выносливости!");return}
 energy-=10;happy=Math.min(100,happy+15);
 say("Прогулка подняла настроение!");
 updateHUD();
};

function openModal(title,text,buttons){
 document.getElementById("modalTitle").textContent=title;
 document.getElementById("modalText").textContent=text;
 const area=document.getElementById("modalButtons");
 area.innerHTML="";
 buttons.forEach(b=>{
  const el=document.createElement("button");
  el.textContent=b.label;
  el.onclick=b.action;
  area.appendChild(el);
 });
 document.getElementById("modal").style.display="flex";
}
window.closeModal=()=>{
 document.getElementById("modal").style.display="none";
};
window.shop=()=>{
 openModal("🛒 Магазин","Что хочешь купить?",[
  {label:"Еда — 100 ₽",action:()=>{if(spend(100)){hunger=Math.min(100,hunger+35);updateHUD();say("Куплена еда!")}closeModal()}},
  {label:"Игрушка — 200 ₽",action:()=>{if(spend(200)){happy=Math.min(100,happy+20);updateHUD();say("Куплена игрушка!")}closeModal()}},
  {label:"Цветок — 150 ₽",action:()=>{if(spend(150)){happy=Math.min(100,happy+15);updateHUD();say("Куплен цветок!")}closeModal()}}
 ]);
};

// Виртуальные ставки — только игровая валюта
window.casino=()=>{
 openModal("🎰 Казино Печегора","Выбери ставку. Шанс указан рядом. При победе выплата — 2 ставки.",[
  {label:"250 ₽ — 40%",action:()=>bet(250,.40)},
  {label:"450 ₽ — 30%",action:()=>bet(450,.30)},
  {label:"650 ₽ — 25%",action:()=>bet(650,.25)},
  {label:"1000 ₽ — 10%",action:()=>bet(1000,.10)}
 ]);
};
function bet(stake,chance){
 if(!spend(stake)){closeModal();return}
 if(Math.random()<chance){
  money+=stake*2;
  say("🎉 Победа! Ты получил "+stake*2+" ₽!");
 }else say("В этот раз не повезло. Попробуй снова позже.");
 updateHUD();closeModal();
}

// Взаимодействие с ближайшим зданием
window.interact=()=>{
 let nearest=null,best=Infinity;
 for(const b of buildings){
  const d=Math.hypot(player.position.x-b.x,player.position.z-b.z);
  if(d<best){best=d;nearest=b}
 }
 if(best>8){say("Подойди ближе к зданию.");return}
 currentPlace=nearest.name;
 document.getElementById("place").textContent=currentPlace;
 say("Ты около здания: "+currentPlace);
 if(nearest.name==="Ратуша"){
  openModal("🏛 Ратуша","Помоги деревне! Награда за задание — 150 ₽.",[
   {label:"Получить награду",action:()=>{
    if(!window.questDone){money+=150;window.questDone=true;say("Задание выполнено! +150 ₽");updateHUD()}
    else say("Задание уже выполнено.");
    closeModal();
   }}
  ]);
 }
};

// Камера и движение
const clock=new THREE.Clock();
function animate(){
 requestAnimationFrame(animate);
 const dt=Math.min(clock.getDelta(),.05);

 let dx=joyX+(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0);
 let dz=joyY+(keys.s||keys.arrowdown?1:0)-(keys.w||keys.arrowup?1:0);
 const length=Math.hypot(dx,dz);
 if(length>1){dx/=length;dz/=length}

 if(length>.05){
  player.position.x+=dx*8*dt;
  player.position.z+=dz*8*dt;
  player.rotation.y=Math.atan2(dx,dz);
  energy=Math.max(0,energy-.8*dt);
 }

 player.position.x=THREE.MathUtils.clamp(player.position.x,-53,53);
 player.position.z=THREE.MathUtils.clamp(player.position.z,-53,53);

 const target=new THREE.Vector3(
  player.position.x,
  player.position.y+3,
  player.position.z+7
 );
 camera.position.lerp(target,1-Math.pow(.001,dt));
 camera.lookAt(player.position.x,player.position.y+1,player.position.z);

 updateHUD();
 renderer.render(scene,camera);
}
animate();

setInterval(()=>{
 hunger=Math.max(0,hunger-.3);
 if(hunger===0)energy=Math.max(0,energy-1);
 updateHUD();
},5000);

window.addEventListener("resize",()=>{
 camera.aspect=innerWidth/innerHeight;
 camera.updateProjectionMatrix();
 renderer.setSize(innerWidth,innerHeight);
});
</script>
</body>
</html>
