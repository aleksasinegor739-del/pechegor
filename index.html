
<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Печегор</title>
<style>
body{margin:0;background:#182d20;color:white;font-family:Arial}
header{padding:15px;background:#28563a;display:flex;justify-content:space-between}
main{padding:15px;text-align:center}
button{padding:12px;margin:5px;border:0;border-radius:10px;background:#4c985d;color:white;font-weight:bold}
.panel{background:#28563a;padding:15px;margin:12px auto;border-radius:15px;max-width:420px}
.bar{height:12px;background:#555;border-radius:10px;margin:8px}
.fill{height:100%;background:#a7df75;border-radius:10px}
#scene{height:230px;background:linear-gradient(#8bc8e8 55%,#65a65b 55%);border-radius:15px;position:relative;overflow:hidden}
#house{position:absolute;bottom:50px;left:35%;width:110px;height:90px;background:#e8d2a9}
#roof{position:absolute;bottom:140px;left:30%;border-left:65px solid transparent;border-right:65px solid transparent;border-bottom:55px solid #814638}
#person{position:absolute;bottom:35px;left:48%;font-size:38px}
</style>
</head>
<body>
<header>
<b>🏡 ПЕЧЕГОР</b>
<b id="money">💰 1250 ₽</b>
</header>
<main>
<div class="panel">
<div id="scene">
<div id="house"></div><div id="roof"></div>
<div id="person">🧍</div>
</div>
<p>Твой дом и двор</p>
</div>
<div class="panel">
<b>Потребности</b>
<p>🍔 Сытость</p><div class="bar"><div class="fill" id="food" style="width:80%"></div></div>
<p>⚡ Энергия</p><div class="bar"><div class="fill" id="energy" style="width:86%"></div></div>
<p>😊 Настроение</p><div class="bar"><div class="fill" id="mood" style="width:90%"></div></div>
</div>
<div class="panel">
<h3>Действия</h3>
<button onclick="shop()">🛒 Купить еду · 80 ₽</button>
<button onclick="work()">💼 Подработка +100 ₽</button>
<button onclick="rest()">🛏 Отдохнуть</button>
<button onclick="toy()">🧸 Игрушка · 150 ₽</button>
<button onclick="garden()">🌼 Ухаживать за садом</button>
<button onclick="fair()">🎪 Ярмарка удачи</button>
</div>
<div class="panel">
<h3>Управление</h3>
<button onclick="move(-15)">◀</button>
<button onclick="move(15)">▶</button>
</div>
<p id="message">Добро пожаловать в Печегор!</p>
</main>
<script>
let money=1250,food=80,energy=86,mood=90;
function update(){
 document.getElementById('money').textContent='💰 '+money+' ₽';
 document.getElementById('food').style.width=food+'%';
 document.getElementById('energy').style.width=energy+'%';
 document.getElementById('mood').style.width=mood+'%';
}
function say(t){document.getElementById('message').textContent=t}
function shop(){
 if(money<80)return say('Не хватает денег!');
 money-=80;food=Math.min(100,food+35);update();say('Продукты куплены!');
}
function work(){
 money+=100;energy=Math.max(0,energy-9);update();say('Ты заработал 100 рублей!');
}
function rest(){
 energy=Math.min(100,energy+32);mood=Math.min(100,mood+8);update();say('Ты отдохнул!');
}
function toy(){
 if(money<150)return say('Не хватает денег!');
 money-=150;mood=Math.min(100,mood+20);update();say('Игрушка куплена!');
}
function garden(){
 mood=Math.min(100,mood+12);energy=Math.max(0,energy-4);update();say('Ты ухаживал за садом!');
}
function fair(){
 let r=Math.random(),prize;
 if(r<.40)prize=250;
 else if(r<.65)prize=500;
 else if(r<.80)prize=1000;
 else prize=150;
 money+=prize;mood=Math.min(100,mood+5);update();
 say('🎉 Бесплатный приз: '+prize+' игровых рублей!');
}
function move(n){
 let p=document.getElementById('person');
 let x=parseFloat(p.style.left)||48;
 p.style.left=Math.max(0,Math.min(90,x+n/10))+'%';
}
update();
</script>
</body>
</html>
