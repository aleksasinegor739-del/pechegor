
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Печегор 3D</title>
<style>
*{box-sizing:border-box}
body{margin:0;overflow:hidden;background:#18251d;font-family:Arial;color:white}
canvas{display:block}
#hud{position:absolute;top:10px;left:10px;background:#17251deF;padding:12px;border-radius:14px;width:220px;font-size:13px}
#money{font-size:19px;color:#ffdf75;font-weight:bold;margin-bottom:8px}
.stat{margin:7px 0}
.track{height:9px;background:#455348;border-radius:8px;overflow:hidden;margin-top:3px}
.fill{height:100%;width:100%;background:#65d77b}
#message{position:absolute;top:12px;left:50%;transform:translateX(-50%);background:#17251ded;padding:11px 16px;border-radius:12px;text-align:center;max-width:90%;z-index:2}
#actions{position:absolute;right:12px;bottom:15px;display:grid;grid-template-columns:repeat(2,115px);gap:7px}
button{border:0;border-radius:10px;padding:11px 7px;background:#e9bd65;color:#29251c;font-weight:bold;cursor:pointer;font-size:13px}
button:active{transform:scale(.96)}
#movement{position:absolute;left:12px;bottom:15px;display:grid;grid-template-columns:repeat(3,46px);grid-template-rows:repeat(2,46px);gap:5px}
#movement button{padding:0;font-size:20px;background:#edf0e3}
.up{grid-column:2}.left{grid-column:1;grid-row:2}.down{grid-column:2;grid-row:2}.right{grid-column:3;grid-row:2}
#modal{display:none;position:absolute;inset:0;background:#000b;z-index:5;align-items:center;justify-content:center;padding:15px}
#modalBox{background:#293d30;padding:22px;border-radius:18px;width:min(390px,100%);max-height:85vh;overflow:auto;text-align:center}
#modalButtons{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin:15px 0}
#modalButtons button{min-width:110px}
@media(max-width:600px){
 #hud{width:185px;padding:9px;font-size:12px}
 #actions{grid-template-columns:repeat(2,85px);gap:5px;right:7px;bottom:10px}
 #actions button{font-size:11px;padding:10px 3px}
 #movement{transform:scale(.9);transform-origin:bottom left;left:7px;bottom:10px}
}
</style>
</head>
<body>
<div id="hud">
 <div id="money">💰 1000 ₽</div>
 <div class="stat">⚡ Выносливость: <b id="energyText">100</b>
  <div class="track"><div class="fill" id="energyBar"></div></div>
 </div>
 <div class="stat">🍗 Голод: <b id="hungerText">100</b>
  <div class="track"><div class="fill" id="hungerBar"></div></div>
 </div>
 <div class="stat">😊 Счастье: <b id="happyText">70</b>
  <div class="track"><div class="fill" id="happyBar"></div></div>
 </div>
 <div>📍 <b id="place">Деревня</b></div>
</div>

<div id="message">Добро пожаловать в Печегор!</div>

<div id="movement">
 <button class="up" data-move="up">▲</button>
 <button class="left" data-move="left">◀</button>
 <button class="down" data-move="down">▼</button>
 <button class="right" data-move="right">▶</button>
</div>

<div id="actions">
 <button onclick="work()">💼 Работа</button>
 <button onclick="eat()">🍞 Поесть</button>
 <button onclick="rest()">🛏 Отдых</button>
 <button onclick="walk()">🌳 Прогулка</button>
 <button onclick="shop()">🛒 Магазин</button>
 <button onclick="casino()">🎰 Казино</button>
 <button onclick="interact()">🚪 Войти / выйти</button>
</div>

<div id="modal">
 <div id="modalBox">
  <h2 id="modalTitle"></h2>
  <p id="modalText"></p>
  <div id="modalButtons"></div>
  <button onclick="closeModal()">Закрыть</button>
 </div>
</div>

<script type="importmap">
{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js"}}
</script>

<script type="module">
import * as THREE from "three";

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x9bd5ed);
scene.fog=new THREE.Fog(0x9bd5ed,45,110);

const camera=new THREE.PerspectiveCamera(65,innerWidth/innerHeight,.1,200);
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.shadowMap.enabled=true;
document.body.prepend(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xffffff,0x557044,2));
const sun=new THREE.DirectionalLight(0xffffff,2);
sun.position.set(-20,30,15);
sun.castShadow=true;
scene.add(sun);

const material=c=>new THREE.MeshStandardMaterial({color:c});
const grass=material(0x65a94d);
const road=material(0xc6ad7d);
const brown=material(0x875337);
const roof=material(0x963e32);

function cube(w,h,d,mat,x,y,z){
 const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat);
 m.position.set(x,y,z);
 m.castShadow=true;m.receiveShadow=true;
 scene.add(m);return m;
}

// Мир
cube(120,.3,120,grass,0,-.2,0);
cube(7,.08,100,road,0,0,0);
cube(100,.08,6,road,0,.01,0);

// Озеро
const lake=new THREE.Mesh(
 new THREE.CircleGeometry(8,48),
 material(0x398ec0)
);
lake.rotation.x=-Math.PI/2;
lake.position.set(23,.03,18);
scene.add(lake);

// Деревья
function tree(x,z){
 const trunk=new THREE.Mesh(new THREE.CylinderGeometry(.25,.35,2,8),brown);
 trunk.position.set(x,1,z);scene.add(trunk);
 const crown=new THREE.Mesh(new THREE.ConeGeometry(1.5,3.5,8),material(0x347a3c));
 crown.position.set(x,3.4,z);scene.add(crown);
}
for(let i=0;i<65;i++){
 const x=(Math.random()-.5)*95;
 const z=(Math.random()-.5)*95;
 if(Math.abs(x)<10||Math.abs(z)<9)continue;
 if(Math.hypot(x-23,z-18)<11)continue;
 tree(x,z);
}

// Здания
const buildings=[
 {name:"Дом",x:-13,z:-11,color:0xe6c18d},
 {name:"Магазин",x:13,z:-12,color:0x6ca8d5},
 {name:"Ратуша",x:-14,z:13,color:0xe7d8bd},
 {name:"Казино",x:14,z:12,color:0x9c5caa}
];

for(const b of buildings){
 cube(9,5,8,material(b.color),b.x,2.5,b.z);
 const r=new THREE.Mesh(new THREE.ConeGeometry(7,3.5,4),roof);
 r.position.set(b.x,6.7,b.z);
 r.rotation.y=Math.PI/4;
 scene.add(r);
 cube(1.5,2.5,.2,brown,b.x,1.25,b.z-4.1);
}

// Персонаж
const player=new THREE.Group();
const body=new THREE.Mesh(new THREE.CylinderGeometry(.55,.7,1.5,12),material(0x4d9dc5));
body.position.y=1.2;
player.add(body);
const head=new THREE.Mesh(new THREE.SphereGeometry(.48,16,12),material(0xf0bd91));
head.position.y=2.25;
player.add(head);
const legMat=material(0x65432f);
const leg1=new THREE.Mesh(new THREE.BoxGeometry(.3,.9,.35),legMat);
const leg2=leg1.clone();
leg1.position.set(-.25,.45,0);
leg2.position.set(.25,.45,0);
player.add(leg1,leg2);
const arm1=new THREE.Mesh(new THREE.BoxGeometry(.25,1,.3),material(0xf0bd91));
const arm2=arm1.clone();
arm1.position.set(-.7,1.3,0);
arm2.position.set(.7,1.3,0);
player.add(arm1,arm2);
player.position.set(0,0,4);
scene.add(player);

let money=1000,energy=100,hunger=100,happy=70;
let inside="";
let townReward=false;
let keys={up:false,down:false,left:false,right:false};

function say(t){document.querySelector("#message").textContent=t}
function update(){
 document.querySelector("#money").textContent="💰 "+money+" ₽";
 for(const [id,v] of [["energy",energy],["hunger",hunger],["happy",happy]]){
  document.getElementById(id+"Text").textContent=Math.round(v);
  document.getElementById(id+"Bar").style.width=v+"%";
 }
 document.querySelector("#place").textContent=inside||"Деревня";
}
function stat(k,v){
 if(k==="energy")energy=THREE.MathUtils.clamp(energy+v,0,100);
 if(k==="hunger")hunger=THREE.MathUtils.clamp(hunger+v,0,100);
 if(k==="happy")happy=THREE.MathUtils.clamp(happy+v,0,100);
 update();
}
function pay(n){
 if(money<n){say("Недостаточно игровых рублей!");return false}
 money-=n;update();return true;
}
function modal(title,text,buttons=[]){
 document.querySelector("#modalTitle").textContent=title;
 document.querySelector("#modalText").textContent=text;
 const box=document.querySelector("#modalButtons");
 box.innerHTML="";
 buttons.forEach(([label,fn])=>{
  const b=document.createElement("button");
  b.textContent=label;b.onclick=fn;box.appendChild(b);
 });
 document.querySelector("#modal").style.display="flex";
}
window.closeModal=()=>document.querySelector("#modal").style.display="none";

// Экономика и действия
window.work=()=>{
 if(energy<20||hunger<10){say("Сначала отдохни и поешь!");return}
 stat("energy",-20);stat("hunger",-10);stat("happy",-2);
 money+=250;update();
 say("Работа выполнена! Ты заработал 250 ₽.");
};
window.eat=()=>{
 if(!pay(100))return;
 stat("hunger",35);
 say("Ты поел. Голод уменьшился.");
};
window.rest=()=>{
 stat("energy",35);stat("happy",7);
 say("Ты восстановил выносливость и настроение.");
};
window.walk=()=>{
 if(energy<8){say("Недостаточно выносливости!");return}
 stat("energy",-8);stat("happy",15);
 say("Прогулка подняла настроение!");
};

window.shop=()=>{
 if(inside!=="Магазин"){say("Подойди к магазину и нажми E.");return}
 modal("Магазин","Выбери покупку:",[
  ["Еда — 100 ₽",()=>{if(pay(100)){stat("hunger",35);say("Ты купил еду.");closeModal()}}],
  ["Игрушка — 200 ₽",()=>{if(pay(200)){stat("happy",20);say("Ты купил игрушку.");closeModal()}}],
  ["Цветок — 150 ₽",()=>{if(pay(150)){stat("happy",15);say("Ты купил цветок.");closeModal()}}]
 ]);
};

// Казино: ставки игровой валютой
window.casino=()=>{
 if(inside!=="Казино"){say("Подойди к казино и нажми E.");return}
 modal("🎰 Казино Печегора",
 "Выбери ставку. Шанс выигрыша указан рядом. При победе ты получишь 2× ставку, при проигрыше ставка списывается.",[
  ["250 ₽ · шанс 40%",()=>playCasino(250,40)],
  ["450 ₽ · шанс 30%",()=>playCasino(450,30)],
  ["650 ₽ · шанс 25%",()=>playCasino(650,25)],
  ["1000 ₽ · шанс 10%",()=>playCasino(1000,10)]
 ]);
};

function playCasino(bet,chance){
 if(!pay(bet))return;
 const win=Math.random()*100<chance;
 if(win){
  const prize=bet*2;
  money+=prize;
  stat("happy",8);
  update();
  modal("🎉 Победа!",`Ты выиграл! На баланс начислено ${prize} ₽.`,[]);
 }else{
  stat("happy",-5);
  modal("Не повезло","В этот раз ставка проиграла. Попробуй другое занятие.",[]);
 }
}

// Вход в здания
function nearest(){
 let result=null,dist=Infinity;
 for(const b of buildings){
  const d=Math.hypot(player.position.x-b.x,player.position.z-b.z);
  if(d<8&&d<dist){result=b;dist=d}
 }
 return result;
}
window.interact=()=>{
 if(inside){
  inside="";update();say("Ты вышел на улицу.");return;
 }
 const b=nearest();
 if(!b){say("Подойди ближе к зданию.");return}
 inside=b.name;update();
 if(b.name==="Дом"){
  modal("🏠 Дом","Ты дома. Здесь можно хорошо восстановить силы.",[
   ["Отдохнуть",()=>{stat("energy",65);stat("happy",15);closeModal();say("Ты отлично отдохнул дома!")}]
  ]);
 }else if(b.name==="Магазин"){
  say("Ты вошёл в магазин. Нажми кнопку «Магазин».");
 }else if(b.name==="Ратуша"){
  if(townReward){say("Ты уже выполнил поручение ратуши.");return}
  modal("🏛 Ратуша","Жители просят помочь с поручением. Награда — 150 ₽.",[
   ["Выполнить поручение",()=>{
    townReward=true;money+=150;stat("happy",10);update();
    closeModal();say("Поручение выполнено! +150 ₽");
   }]
  ]);
 }else if(b.name==="Казино"){
  say("Ты в казино. Нажми кнопку «Казино», чтобы выбрать ставку.");
 }
};

// Клавиатура
window.addEventListener("keydown",e=>{
 const k=e.key.toLowerCase();
 if(k==="w"||k==="arrowup")keys.up=true;
 if(k==="s"||k==="arrowdown")keys.down=true;
 if(k==="a"||k==="arrowleft")keys.left=true;
 if(k==="d"||k==="arrowright")keys.right=true;
 if(k==="e")interact();
});
window.addEventListener("keyup",e=>{
 const k=e.key.toLowerCase();
 if(k==="w"||k==="arrowup")keys.up=false;
 if(k==="s"||k==="arrowdown")keys.down=false;
 if(k==="a"||k==="arrowleft")keys.left=false;
 if(k==="d"||k==="arrowright")keys.right=false;
});

// Экранные кнопки
document.querySelectorAll("[data-move]").forEach(btn=>{
 const key=btn.dataset.move;
 btn.addEventListener("pointerdown",e=>{e.preventDefault();keys[key]=true});
 for(const ev of ["pointerup","pointerleave","pointercancel"])
  btn.addEventListener(ev,()=>keys[key]=false);
});

// Время и восстановление
setInterval(()=>{
 if(!inside){
  stat("hunger",-0.5);
  if(energy>0)stat("energy",-0.15);
 }
 if(hunger<20)stat("happy",-1);
},5000);

// Камера и движение
const clock=new THREE.Clock();
function animate(){
 requestAnimationFrame(animate);
 const dt=Math.min(clock.getDelta(),.05);
 if(!inside){
  let dx=0,dz=0;
  if(keys.up)dz-=1;
  if(keys.down)dz+=1;
  if(keys.left)dx-=1;
  if(keys.right)dx+=1;
  const moving=dx!==0||dz!==0;
  if(moving){
   const len=Math.hypot(dx,dz);
   dx/=len;dz/=len;
   player.position.x+=dx*7*dt;
   player.position.z+=dz*7*dt;
   player.rotation.y=Math.atan2(dx,dz);
  }
  player.position.x=THREE.MathUtils.clamp(player.position.x,-53,53);
  player.position.z=THREE.MathUtils.clamp(player.position.z,-53,53);
 }
 const target=new THREE.Vector3(
  player.position.x,
  player.position.y+3,
  player.position.z+7
 );
 camera.position.lerp(target,.09);
 camera.lookAt(player.position.x,player.position.y+1,player.position.z);
 renderer.render(scene,camera);
}
animate();

window.addEventListener("resize",()=>{
 camera.aspect=innerWidth/innerHeight;
 camera.updateProjectionMatrix();
 renderer.setSize(innerWidth,innerHeight);
});
update();
</script>
</body>
</html>
