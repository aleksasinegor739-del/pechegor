<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#183c2b"><title>Печегор — жизнь начинается здесь</title><style>
*{box-sizing:border-box}body{margin:0;overflow:hidden;background:#14251b;color:#fff;font-family:system-ui,Arial}#game{position:fixed;inset:0}canvas{display:block;width:100%;height:100%;touch-action:none}.glass{background:linear-gradient(135deg,#173728eF,#10251ddd);border:1px solid #d9e8c955;border-radius:16px;box-shadow:0 8px 28px #07140d66;backdrop-filter:blur(10px)}#top{position:absolute;top:10px;left:10px;right:10px;display:flex;justify-content:space-between;align-items:flex-start;gap:8px;pointer-events:none}#brand{padding:10px 14px;font-weight:900;font-size:clamp(16px,4vw,23px);letter-spacing:.5px}#money{padding:12px;font-weight:900;color:#ffe28a}#stats{position:absolute;top:75px;left:10px;width:min(205px,48vw);padding:10px 12px}.stat{font-size:12px;margin:5px 0}.bar{height:8px;border-radius:20px;background:#ffffff30;overflow:hidden;margin-top:3px}.fill{height:100%;width:80%;border-radius:20px;background:linear-gradient(90deg,#65c878,#c4e879)}#family{position:absolute;top:75px;right:10px;padding:8px;display:flex;gap:5px;flex-direction:column}button{font:700 13px system-ui;color:#fff;background:linear-gradient(#39704e,#204b35);border:1px solid #b9d5a866;border-radius:12px;padding:10px;box-shadow:0 3px 0 #102c20;touch-action:manipulation}button:active{transform:translateY(2px);box-shadow:0 1px 0 #102c20}#family button{padding:7px 10px}#actions{position:absolute;right:10px;bottom:12px;display:grid;grid-template-columns:repeat(2,minmax(105px,1fr));gap:7px;width:min(245px,58vw)}#controls{position:absolute;left:12px;bottom:18px;display:grid;grid-template-columns:repeat(3,48px);grid-template-rows:repeat(2,48px);gap:5px}#controls button{font-size:21px;padding:0;background:#183c2bdc}#hint{position:absolute;left:50%;bottom:7px;transform:translateX(-50%);font-size:10px;color:#fffD;white-space:nowrap;text-shadow:0 2px 4px #000}#toast{position:absolute;left:50%;top:48%;transform:translate(-50%,-50%);padding:12px 17px;max-width:88vw;text-align:center;display:none;z-index:5}#modal{position:absolute;inset:0;display:none;place-items:center;background:#07150bb8;padding:18px;z-index:8}#modal .card{width:min(420px,94vw);padding:18px}#modal h2{margin:0 0 10px}#modal p{font-size:14px;line-height:1.45}#modal .row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}#ad{position:absolute;display:none;inset:0;z-index:10;background:#21102beF;place-items:center;text-align:center;padding:24px}#ad strong{display:block;font-size:clamp(42px,12vw,76px);color:#ffdf52;text-shadow:4px 5px #9b1738;transform:rotate(-5deg)}#ad p{font-size:18px}#ad button{background:#a52d50;font-size:16px;padding:13px 24px}@media(max-width:390px){#controls{grid-template-columns:repeat(3,43px);grid-template-rows:repeat(2,43px)}#actions{width:52vw}#actions button{font-size:11px;padding:9px 4px}#stats{top:72px}}
</style></head><body><div id="game"></div><div id="top"><div id="brand" class="glass">🏡 ПЕЧЕГОР <small style="display:block;font-size:10px;font-weight:500">Твоя маленькая большая жизнь</small></div><div id="money" class="glass">💰 1 250 ₽</div></div><div id="stats" class="glass"><b>Потребности</b><div class="stat">🍔 Сытость<div class="bar"><div class="fill" id="food"></div></div></div><div class="stat">⚡ Энергия<div class="bar"><div class="fill" id="energy"></div></div></div><div class="stat">😊 Настроение<div class="bar"><div class="fill" id="mood"></div></div></div></div><div id="family"><button id="adult">🧑 Взрослый</button><button id="kid">🧒 Ребёнок</button></div><div id="controls"><span></span><button data-dir="forward">▲</button><span></span><button data-dir="left">◀</button><button data-dir="back">▼</button><button data-dir="right">▶</button></div><div id="actions"><button id="house">🏠 Дом / улица</button><button id="shop">🛒 Магазин еды · 80 ₽</button><button id="work">💼 Подработка +100 ₽</button><button id="rest">🛏 Отдохнуть</button><button id="toy">🧸 Купить игрушку · 150 ₽</button><button id="garden">🌼 Ухаживать за садом</button></div><div id="hint">Управление: стрелки на экране или WASD · Подойди к дому, чтобы войти</div><div id="toast" class="glass"></div><div id="modal"><div class="card glass"><h2 id="modalTitle">Дом</h2><p id="modalText"></p><div class="row"><button id="modalClose">Закрыть</button></div></div></div><div id="ad"><div><strong>ТЫ ЛОХ!</strong><p>Реклама исчезнет через <b id="count">10</b> секунд</p><button id="adClose">Закрыть рекламу ✕</button></div></div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';
const host=document.querySelector('#game'),scene=new THREE.Scene();scene.background=new THREE.Color('#9bc9e8');scene.fog=new THREE.Fog('#9bc9e8',35,95);
const camera=new THREE.PerspectiveCamera(52,innerWidth/innerHeight,.1,180);const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio,1.8));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.12;host.appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xe8f5ff,0x536c3c,1.65));const sun=new THREE.DirectionalLight(0xffedcf,2.8);sun.position.set(-18,28,15);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);sun.shadow.camera.left=-35;sun.shadow.camera.right=35;sun.shadow.camera.top=35;sun.shadow.camera.bottom=-35;scene.add(sun);
const mat=(c,r=.82,m=0)=>new THREE.MeshStandardMaterial({color:c,roughness:r,metalness:m});function add(geo,material,x,y,z,parent=scene){const o=new THREE.Mesh(geo,material);o.position.set(x,y,z);o.castShadow=true;o.receiveShadow=true;parent.add(o);return o}function cube(w,h,d,c,x,y,z,p=scene){return add(new THREE.BoxGeometry(w,h,d),mat(c),x,y,z,p)}
// landscaped neighborhood
cube(150,.4,150,'#6eaa61',0,-.35,0);cube(6,.08,100,'#aaa69a',-14,-.1,0);for(let i=0;i<30;i++){cube(5,.015,.035,'#eee5c8',-14,-.02,-47+i*3.3)}
// distant hills and trees
for(let i=0;i<24;i++){let x=-45+(i%8)*13,z=-35+Math.floor(i/8)*19;add(new THREE.SphereGeometry(7+Math.random()*4,12,9),mat(i%2?'#568a55':'#6d9b5a'),x,1,z)}
function tree(x,z,s=1){add(new THREE.CylinderGeometry(.22*s,.35*s,2.2*s,8),mat('#765039'),x,1.1*s,z);for(let j=0;j<3;j++){let c=add(new THREE.IcosahedronGeometry(1.35*s,1),mat(['#347747','#438b4b','#286b3d'][j]),x+(j-1)*.38*s,2.6*s+j*.55*s,z);c.scale.set(1,1.05,1)}}for(const p of [[-10,-4,1.4],[10,-6,1.5],[-22,8,2],[18,9,1.7],[-9,17,1.5],[12,20,1.8],[-30,-20,2],[28,-22,2]])tree(...p);
// cottage shell
const house=new THREE.Group();scene.add(house);cube(10,4.4,8,'#e7d3b1',0,2.2,-8,house);let roof=add(new THREE.ConeGeometry(7.4,3.6,4),mat('#704235'),0,6.1,-8,house);roof.rotation.y=Math.PI/4;cube(1.35,2.5,.18,'#70452e',0,1.25,-3.88,house);for(let x of [-3.1,3.1]){cube(1.8,1.5,.18,'#77c8e8',x,2.7,-3.86,house);cube(1.95,.12,.25,'#fff0ce',x,2.7,-3.72,house);cube(.12,1.55,.25,'#fff0ce',x,2.7,-3.72,house)}cube(1.2,1.6,.5,'#8b8d8c',-3.6,6.8,-8,house);cube(1.4,.22,1.1,'#553d35',-3.6,7.7,-8,house);
// porch, path, garden beds
cube(5,.25,2.3,'#9a704c',0,.25,-2.4);for(let i=0;i<8;i++){let s=cube(.82,.12,.72,i%2?'#c6b99f':'#b4a58c',0,.03,1.1+i*.85);s.position.x=Math.sin(i*.6)*.3}function flower(x,z,c){add(new THREE.CylinderGeometry(.035,.05,.45,6),mat('#397b3b'),x,.23,z);add(new THREE.SphereGeometry(.17,10,8),mat(c),x,.5,z);for(let k=0;k<5;k++){let pet=add(new THREE.SphereGeometry(.09,8,6),mat(c),x+Math.cos(k*1.256)*.13,.5,z+Math.sin(k*1.256)*.13)}}for(let side of [-1,1]){cube(1.8,.25,5,'#76503a',side*6,.12,-.4);for(let j=0;j<12;j++)flower(side*(5.4+Math.random()*.9),-2.5+Math.random()*4.5,['#f4a6bd','#ffda68','#c5a7ed','#fff0df'][j%4]);for(let j=0;j<8;j++)cube(.14,.9,.14,'#e8dfc8',side*10,.45,-10+j*2.7)}
function bush(x,z){let b=add(new THREE.IcosahedronGeometry(.65,1),mat('#2d703c'),x,.55,z);b.scale.set(1.3,.8,1.1)}for(let x of [-7,-5,5,7])bush(x,3);function lamp(x,z){add(new THREE.CylinderGeometry(.07,.11,2.7,10),mat('#3c4440'),x,1.35,z);add(new THREE.SphereGeometry(.24,12,10),new THREE.MeshStandardMaterial({color:'#ffe9a6',emissive:'#ffb84d',emissiveIntensity:1.1}),x,2.8,z)}lamp(-4,1);lamp(4,1);cube(2,.16,.55,'#8c5936',6,.7,4);cube(2,.65,.14,'#70452e',6,1,4.25);cube(.5,.45,.4,'#bb3434',-4,.8,-1);cube(.54,.08,.45,'#eeeeee',-4,1.05,-1);
// interior room hidden until entered
const interior=new THREE.Group();scene.add(interior);cube(12,.25,10,'#b78f68',0,.05,-8,interior);cube(12,4, .25,'#e9d7b9',0,2,-13,interior);cube(12,4,.25,'#e9d7b9',0,2,-3,interior);cube(.25,4,10,'#d9c19f',-6,2,-8,interior);cube(.25,4,10,'#d9c19f',6,2,-8,interior);cube(3,.6,1.4,'#527a9b',-3,.55,-10,interior);cube(3,.5,1.4,'#e4d4bd',-3,1,-10,interior);cube(2,.9,1,'#8b5b37',3,.5,-10,interior);cube(1.3,1.3,.1,'#8a6a45',0,1,-12.8,interior);interior.visible=false;
// character with animated limbs
function makePerson(shirt,scale=1){let g=new THREE.Group();let torso=add(new THREE.CapsuleGeometry(.38,.72,5,10),mat(shirt),0,1.1,0,g);let head=add(new THREE.SphereGeometry(.31,16,12),mat('#d6a078'),0,1.86,0,g);let hair=add(new THREE.SphereGeometry(.32,12,8),mat('#493326'),0,2.03,-.04,g);hair.scale.set(1,.55,1);let legs=[];for(let x of [-.17,.17])legs.push(add(new THREE.CapsuleGeometry(.12,.48,4,8),mat('#34465b'),x,.38,0,g));return {g,legs,torso}}
const adult=makePerson('#3978a9'),child=makePerson('#d57c45',.78);scene.add(adult.g,child.g);adult.g.position.set(2,0,5);child.g.position.set(3,0,6);child.g.scale.setScalar(.78);let active=adult,inside=false,coins=1250,food=80,energy=86,mood=90,toyOwned=false,adTimer=null;
function toast(t){let el=document.querySelector('#toast');el.textContent=t;el.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>el.style.display='none',2500)}function ui(){document.querySelector('#money').textContent='💰 '+coins.toLocaleString('ru-RU')+' ₽';for(let [id,v] of [['food',food],['energy',energy],['mood',mood]])document.getElementById(id).style.width=v+'%'}function spend(n){if(coins<n){toast('Не хватает денег! Попробуй подработать.');return false}coins-=n;return true}
document.querySelector('#adult').onclick=()=>{active=adult;toast('Теперь управляем взрослым')};document.querySelector('#kid').onclick=()=>{active=child;toast('Теперь управляем ребёнком')};document.querySelector('#shop').onclick=()=>{if(spend(80)){food=Math.min(100,food+35);ui();toast('Продукты куплены! Сытость +35')}};document.querySelector('#work').onclick=()=>{coins+=100;energy=Math.max(0,energy-9);ui();toast('Подработка выполнена: +100 ₽')};document.querySelector('#rest').onclick=()=>{energy=Math.min(100,energy+32);mood=Math.min(100,mood+8);ui();toast('Хороший отдых! Энергия восстановлена')};document.querySelector('#toy').onclick=()=>{if(spend(150)){toyOwned=true;mood=Math.min(100,mood+20);ui();toast('Куплена игрушка! Настроение +20')}};document.querySelector('#garden').onclick=()=>{mood=Math.min(100,mood+12);energy=Math.max(0,energy-4);ui();toast('Сад стал красивее. Настроение +12')};
document.querySelector('#house').onclick=()=>{inside=!inside;interior.visible=inside;house.visible=!inside;toast(inside?'Ты дома! Здесь можно отдохнуть.':'Ты вышел во двор.');if(inside)active.g.position.set(0,0,-7);else active.g.position.set(1,0,2)};
const keys={};document.querySelectorAll('[data-dir]').forEach(b=>{let d=b.dataset.dir;b.addEventListener('pointerdown',e=>{e.preventDefault();keys[d]=true});['pointerup','pointerleave','pointercancel'].forEach(ev=>b.addEventListener(ev,()=>keys[d]=false))});addEventListener('keydown',e=>{let k=e.key.toLowerCase();if(['w','arrowup'].includes(k))keys.forward=true;if(['s','arrowdown'].includes(k))keys.back=true;if(['a','arrowleft'].includes(k))keys.left=true;if(['d','arrowright'].includes(k))keys.right=true});addEventListener('keyup',e=>{let k=e.key.toLowerCase();if(['w','arrowup'].includes(k))keys.forward=false;if(['s','arrowdown'].includes(k))keys.back=false;if(['a','arrowleft'].includes(k))keys.left=false;if(['d','arrowright'].includes(k))keys.right=false});
const modal=document.querySelector('#modal');function showModal(t,p){document.querySelector('#modalTitle').textContent=t;document.querySelector('#modalText').textContent=p;modal.style.display='grid'}document.querySelector('#modalClose').onclick=()=>modal.style.display='none';
function ad(){let el=document.querySelector('#ad');el.style.display='grid';let n=10;document.querySelector('#count').textContent=n;clearInterval(adTimer);adTimer=setInterval(()=>{n--;document.querySelector('#count').textContent=n;if(n<=0){clearInterval(adTimer);el.style.display='none'}},1000)}document.querySelector('#adClose').onclick=()=>{clearInterval(adTimer);document.querySelector('#ad').style.display='none'};setTimeout(ad,30000);
let clock=new THREE.Clock(),elapsed=0;function animate(){requestAnimationFrame(animate);let dt=Math.min(clock.getDelta(),.04);elapsed+=dt;let dx=(keys.right?1:0)-(keys.left?1:0),dz=(keys.back?1:0)-(keys.forward?1:0);if(dx||dz){let len=Math.hypot(dx,dz);active.g.position.x+=dx/len*4*dt;active.g.position.z+=dz/len*4*dt;active.g.position.x=THREE.MathUtils.clamp(active.g.position.x,-12,12);active.g.position.z=THREE.MathUtils.clamp(active.g.position.z,-18,15);active.g.rotation.y=Math.atan2(dx,dz);active.legs[0].rotation.x=Math.sin(elapsed*11)*.55;active.legs[1].rotation.x=-Math.sin(elapsed*11)*.55}else{active.legs.forEach(l=>l.rotation.x=0)}if(!inside){let other=active===adult?child:adult;other.g.position.lerp(new THREE.Vector3(active.g.position.x+1.2,0,active.g.position.z+1.2),.012)}let target=new THREE.Vector3(active.g.position.x,active.g.position.y+1,active.g.position.z);camera.position.lerp(new THREE.Vector3(active.g.position.x+7,8,active.g.position.z+10),.055);camera.lookAt(target);renderer.render(scene,camera)}
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});camera.position.set(9,9,16);ui();animate();
</script></body></html>
