
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Печегор 3D</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:Arial;background:#8cc9e8}
canvas{display:block}
#hud{position:fixed;top:8px;left:8px;z-index:2;background:#17251de8;color:white;padding:10px;border-radius:12px;width:180px;font-size:12px}
#money{font-size:17px;color:#ffdf75;font-weight:bold}
.stat{margin-top:6px}
.track{height:7px;background:#455448;border-radius:8px;overflow:hidden}
.fill{height:100%;background:#70d879;width:100%}
#message{position:fixed;top:8px;left:50%;transform:translateX(-50%);z-index:3;background:#17251de8;color:white;padding:9px;border-radius:10px;font-size:12px;text-align:center;max-width:50%}
#joystick{position:fixed;left:20px;bottom:20px;width:130px;height:130px;border-radius:50%;background:#ffffff55;border:3px solid #ffffffaa;z-index:4;touch-action:none}
#stick{position:absolute;left:50%;top:50%;width:55px;height:55px;transform:translate(-50%,-50%);border-radius:50%;background:#f1c76c;border:3px solid white;pointer-events:none}
#actions{position:fixed;right:8px;bottom:12px;z-index:4;display:grid;grid-template-columns:repeat(2,88px);gap:6px}
button{border:0;border-radius:10px;padding:10px 5px;background:#e9bd65;color:#29251c;font-weight:bold;font-size:12px}
button:active{transform:scale(.96)}
#modal{display:none;position:fixed;inset:0;z-index:10;background:#000a;align-items:center;justify-content:center;padding:12px}
#box{background:#293d30;color:white;border-radius:15px;padding:18px;width:min(370px,95vw);text-align:center}
#modalButtons{display:flex;flex-wrap:wrap;gap:7px;justify-content:center;margin:12px}
@media(max-height:430px){
 #joystick{width:105px;height:105px;bottom:10px}
 #stick{width:45px;height:45px}
 #actions{grid-template-columns:repeat(2,75px);bottom:5px}
 button{padding:7px 3px;font-size:10px}
}
</style>
</head>
<body>

<div id="hud">
 <div id="money">💰 1000 ₽</div>
 <div class="stat">⚡ Выносливость: <b id="energyText">100</b><div class="track"><div class="fill" id="energyBar"></div></div></div>
 <div class="stat">🍗 Голод: <b id="hungerText">100</b><div class="track"><div class="fill" id="hungerBar"></div></div></div>
 <div class="stat">😊 Счастье: <b id="happyText">70</b><div class="track"><div class="fill" id="happyBar"></div></div></div>
 <div>📍 <b id="place">Деревня</b></div>
</div>

<div id="message">Добро пожаловать в Печегор!</div>
<div id="joystick"><div id="stick"></div></div>

<div id="actions">
 <button onclick="work()">💼 Работа</button>
 <button onclick="eat()">🍞 Поесть</button>
 <button onclick="rest()">🛏 Отдых</button>
 <button onclick="walk()">🌳 Прогулка</button>
 <button onclick="shop()">🛒 Магазин</button>
 <button onclick="casino()">🎰 Казино</button>
 <button onclick="interact()">🚪 Действие</button>
</div>

<div id="modal">
 <div id="box">
  <h2 id="modalTitle"></h2>
  <p id="modalText"></p>
  <div id="modalButtons"></div>
  <button onclick="closeModal()">Закрыть</button>
 </div>
</div>

<script type="importmap">
{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js"}}
</script>

<script type="module">
import * as THREE from "three";

// -------------------------
// ОСНОВА
// -------------------------

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x9bd5ed);
scene.fog=new THREE.Fog(0x9bd5ed,45,110);

const camera=new THREE.PerspectiveCamera(65,innerWidth/innerHeight,.1,250);
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));
renderer.shadowMap.enabled=true;
document.body.prepend(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xffffff,0x557044,2));
const sun=new THREE.DirectionalLight(0xffffff,1.7);
sun.position.set(-20,35,15);
sun.castShadow=true;
scene.add(sun);

const world=new THREE.Group();
const homeInterior=new THREE.Group();
scene.add(world,homeInterior);

const mat=c=>new THREE.MeshStandardMaterial({color:c});
function block(parent,w,h,d,color,x,y,z){
 const mesh=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat(color));
 mesh.position.set(x,y,z);
 mesh.castShadow=true;
 mesh.receiveShadow=true;
 parent.add(mesh);
 return mesh;
}

// -------------------------
// ДЕРЕВНЯ
// -------------------------

block(world,120,.3,120,0x65a94d,0,-.2,0);
block(world,7,.08,100,0xc6ad7d,0,0,0);
block(world,100,.08,7,0xc6ad7d,0,.01,0);

// Озеро
block(world,18,.15,13,0x379bc9,20,.02,-18);

const buildings=[];
function houseOutside(name,x,z,color){
 block(world,8,5,7,color,x,2.5,z);
 const roof=block(world,9,1,8,0x8c4332,x,5.5,z);
 roof.rotation.z=.12;
 block(world,1.5,2.5,.2,0x553622,x,1.25,z+3.61);
 buildings.push({name,x,z});
}
houseOutside("Дом",-13,-12,0xd9bd8c);
houseOutside("Магазин",12,8,0xd9a85e);
houseOutside("Ратуша",-13,12,0xd8d8c8);
houseOutside("Казино",14,-5,0xb77bc4);

// Деревья
for(let i=0;i<45;i++){
 const x=Math.random()*100-50;
 const z=Math.random()*100-50;
 if(Math.abs(x)<10&&Math.abs(z)<10)continue;
 block(world,.6,2,.6,0x704329,x,1,z);
 const crown=new THREE.Mesh(
  new THREE.BoxGeometry(2.5,2.5,2.5),
  mat(0x287b3d)
 );
 crown.position.set(x,3,z);
 world.add(crown);
}

// -------------------------
// ПЕРСОНАЖ В СТИЛЕ СТИВА
// -------------------------

const player=new THREE.Group();
scene.add(player);

const character=new THREE.Group();
player.add(character);

const skin=mat(0xc58b61);
const shirt=mat(0x287bc0);
const pants=mat(0x303c91);
const shoes=mat(0x44342c);
const hair=mat(0x493020);

function part(parent,w,h,d,material,x,y,z){
 return block(parent,w,h,d,material,x,y,z);
}

// Туловище
part(character,1,1.2,.5,shirt,0,1.55,0);

// Голова
part(character,.85,.85,.85,skin,0,2.6,0);

// Волосы
part(character,.87,.25,.87,hair,0,3.13,0);
part(character,.87,.5,.12,hair,0,2.95,-.39);

// Глаза
part(character,.13,.12,.04,mat(0xffffff),-.2,2.68,-.44);
part(character,.13,.12,.04,mat(0xffffff),.2,2.68,-.44);
part(character,.06,.12,.03,mat(0x2222aa),-.2,2.68,-.47);
part(character,.06,.12,.03,mat(0x2222aa),.2,2.68,-.47);

// Ноги с шарнирами
function makeLimb(material,x,y,length){
 const pivot=new THREE.Group();
 pivot.position.set(x,y,0);
 character.add(pivot);
 part(pivot,.4,length,.45,material,0,-length/2,0);
 return pivot;
}
const leftLeg=makeLimb(pants,-.25,.95,.9);
const rightLeg=makeLimb(pants,.25,.95,.9);

// Обувь
part(leftLeg,.42,.22,.5,shoes,0,-.83,-.04);
part(rightLeg,.42,.22,.5,shoes,0,-.83,-.04);

// Руки
const leftArm=makeLimb(shirt,-.68,2.05,.95);
const rightArm=makeLimb(shirt,.68,2.05,.95);
part(leftArm,.4,.25,.45,skin,0,-.94,0);
part(rightArm,.4,.25,.45,skin,0,-.94,0);

player.position.set(0,0,5);

// -------------------------
// ДОМ ВНУТРИ
// -------------------------

// Дом стоит отдельной комнатой в другой части мира.
// При входе персонаж переносится внутрь.

const room=new THREE.Group();
homeInterior.add(room);

// Пол и стены
block(room,18,.3,16,0xb78b58,0,-.15,0);
block(room,18,5,.3,0xe4d3ae,0,2.5,-8);
block(room,.3,5,16,0xe4d3ae,-9,2.5,0);
block(room,.3,5,16,0xe4d3ae,9,2.5,0);
block(room,18,5,.3,0xe4d3ae,0,2.5,8);

// Потолок
block(room,18,.3,16,0xd2b88c,0,5,0);

// Ковёр
block(room,7,.08,5,0x9e3737,-3,.05,-2);

// Гостиная: диван
block(room,4,.8,1.3,0x3869a5,-3,.55,-5);
block(room,4,1.4,.35,0x28548d,-3,1.2,-5.55);
block(room,.35,1,.9,0x28548d,-5,1,-5);
block(room,.35,1,.9,0x28548d,-1,1,-5);

// Кресло
block(room,1.6,.7,1.4,0x4b8a58,3,.5,-5);
block(room,1.6,1,.3,0x397348,3,1,-5.7);

// Телевизор и тумба
block(room,3,.5,.8,0x754b2d,3,.25,-1);
block(room,2.3,1.4,.15,0x202020,3,1.2,-1.2);
block(room,2.1,1.2,.05,0x438fc5,3,1.2,-1.31);

// Спальня
block(room,4,.5,2.7,0x70462f,-4,.4,3);
block(room,3.8,.35,2.5,0xe7e1d6,-4,.8,3);
block(room,1.6,.25,1,0xffffff,-4,1,3.7);
block(room,1.5,2.5,.8,0x80502f,-7,1.25,5);
block(room,1.8,.25,.9,0x9b693d,-7,2.6,5);

// Кухня
block(room,5,1,.9,0x8d5834,4,.6,4);
block(room,5,.15,1,0xd6c8a6,4,1.15,4);
block(room,1.3,2,1,0xcccccc,7,1,6);
block(room,.8,.15,.8,0x252525,4.5,1.3,4);
block(room,.8,.15,.8,0x252525,2.8,1.3,4);

// Холодильник
block(room,1.4,2.8,1,0xd9e0e5,7,1.4,-2);
block(room,.08,1,.1,0x666666,6.3,1.4,-1.45);

// Стол и стулья
block(room,3,.25,2,0x8a572f,3,1,1);
for(const x of [2,4]){
 block(room,.3,1,.3,0x70462f,x,.5,0);
 block(room,.3,1,.3,0x70462f,x,.5,2);
}

// Окна
block(room,2,1.5,.08,0x72b8e5,0,2.7,-7.78);
block(room,.12,1.6,.12,0xffffff,0,2.7,-7.7);
block(room,2.2,.12,.12,0xffffff,0,2.7,-7.7);

// Дверь
block(room,1.8,2.8,.2,0x704329,0,1.4,7.8);

// Свет в доме
const roomLight=new THREE.PointLight(0xffe2a8,35,30);
roomLight.position.set(0,4,0);
room.add(roomLight);

// Внутренние координаты
room.position.set(100,0,100);

// -------------------------
// СОСТОЯНИЕ И ИНТЕРФЕЙС
// -------------------------

let money=1000,energy=100,hunger=100,happy=70;
let indoors=false;
let questDone=false;
let joyX=0,joyY=0;
const keys={};

function updateHUD(){
 document.getElementById("money").textContent="💰 "+money+" ₽";
 for(const [id,value] of [["energy",energy],["hunger",hunger],["happy",happy]]){
  document.getElementById(id+"Text").textContent=Math.round(value);
  document.getElementById(id+"Bar").style.width=value+"%";
 }
}
function say(text){
 document.getElementById("message").textContent=text;
}
function spend(amount){
 if(money<amount){say("Недостаточно денег!");return false}
 money-=amount;updateHUD();return true;
}

// -------------------------
// ДЖОЙСТИК
// -------------------------

const joystick=document.getElementById("joystick");
const stick=document.getElementById("stick");
let activePointer=null;

function moveStick(e){
 const r=joystick.getBoundingClientRect();
 let x=e.clientX-(r.left+r.width/2);
 let y=e.clientY-(r.top+r.height/2);
 const max=36,d=Math.hypot(x,y);
 if(d>max){x=x/d*max;y=y/d*max}
 joyX=x/max;joyY=y/max;
 stick.style.left=`calc(50% + ${x}px)`;
 stick.style.top=`calc(50% + ${y}px)`;
}
function stopStick(){
 activePointer=null;joyX=0;joyY=0;
 stick.style.left="50%";stick.style.top="50%";
}
joystick.addEventListener("pointerdown",e=>{
 activePointer=e.pointerId;
 joystick.setPointerCapture(e.pointerId);
 moveStick(e);
});
joystick.addEventListener("pointermove",e=>{
 if(e.pointerId===activePointer)moveStick(e);
});
joystick.addEventListener("pointerup",stopStick);
joystick.addEventListener("pointercancel",stopStick);
joystick.addEventListener("lostpointercapture",stopStick);

window.addEventListener("keydown",e=>keys[e.key.toLowerCase()]=true);
window.addEventListener("keyup",e=>keys[e.key.toLowerCase()]=false);

// -------------------------
// ИГРОВЫЕ ДЕЙСТВИЯ
// -------------------------

window.work=()=>{
 if(energy<20||hunger<10){say("Нужно отдохнуть или поесть!");return}
 money+=250;energy-=20;hunger-=10;
 say("Ты заработал 250 ₽!");updateHUD();
};

window.eat=()=>{
 if(!spend(100))return;
 hunger=Math.min(100,hunger+35);
 say("Ты поел.");updateHUD();
};

window.rest=()=>{
 energy=Math.min(100,energy+35);
 happy=Math.min(100,happy+10);
 say("Ты отдохнул.");updateHUD();
};

window.walk=()=>{
 if(energy<10){say("Не хватает выносливости!");return}
 energy-=10;happy=Math.min(100,happy+15);
 say("Прогулка подняла настроение!");updateHUD();
};

// -------------------------
// ОКНА И МАГАЗИН
// -------------------------

function openModal(title,text,buttons){
 document.getElementById("modalTitle").textContent=title;
 document.getElementById("modalText").textContent=text;
 const area=document.getElementById("modalButtons");
 area.innerHTML="";
 buttons.forEach(b=>{
  const el=document.createElement("button");
  el.textContent=b.label;el.onclick=b.action;
  area.appendChild(el);
 });
 document.getElementById("modal").style.display="flex";
}
window.closeModal=()=>{
 document.getElementById("modal").style.display="none";
};

window.shop=()=>{
 openModal("🛒 Магазин","Выбери покупку:",[
  {label:"Еда — 100 ₽",action:()=>{
   if(spend(100)){hunger=Math.min(100,hunger+35);say("Куплена еда!");updateHUD()}
   closeModal();
  }},
  {label:"Игрушка — 200 ₽",action:()=>{
   if(spend(200)){happy=Math.min(100,happy+20);say("Куплена игрушка!");updateHUD()}
   closeModal();
  }},
  {label:"Цветок — 150 ₽",action:()=>{
   if(spend(150)){happy=Math.min(100,happy+15);say("Куплен цветок!");updateHUD()}
   closeModal();
  }}
 ]);
};

// Казино с виртуальными игровыми монетами
window.casino=()=>{
 openModal("🎰 Казино Печегора","Выбери ставку. При победе выплата — 2 ставки.",[
  {label:"250 ₽ — 40%",action:()=>bet(250,.40)},
  {label:"450 ₽ — 30%",action:()=>bet(450,.30)},
  {label:"650 ₽ — 25%",action:()=>bet(650,.25)},
  {label:"1000 ₽ — 10%",action:()=>bet(1000,.10)}
 ]);
};
function bet(stake,chance){
 if(!spend(stake)){closeModal();return}
 if(Math.random()<chance){
  money+=stake*2;
  say("🎉 Победа! Получено "+stake*2+" ₽!");
 }else say("В этот раз не повезло.");
 updateHUD();closeModal();
}

// -------------------------
// ДОМ И МЕБЕЛЬ
// -------------------------

function enterHome(){
 indoors=true;
 world.visible=false;
 homeInterior.visible=true;
 player.position.set(100,0,102);
 document.getElementById("place").textContent="Дом";
 say("Ты дома! Подойди к мебели и нажми «Действие».");
 camera.position.set(100,5,110);
}
function leaveHome(){
 indoors=false;
 world.visible=true;
 homeInterior.visible=false;
 player.position.set(-13,0,-7);
 document.getElementById("place").textContent="Деревня";
 say("Ты вышел из дома.");
}

window.interact=()=>{
 if(indoors){
  const x=player.position.x-100;
  const z=player.position.z-100;

  if(Math.hypot(x+4,z-3)<2.5){
   openModal("🛏 Кровать","Отдохнуть и восстановить силы?",[
    {label:"Поспать",action:()=>{
     energy=100;happy=Math.min(100,happy+15);
     say("Ты хорошо выспался!");updateHUD();closeModal();
    }}
   ]);
   return;
  }

  if(Math.hypot(x-3,z+1)<2.5){
   openModal("📺 Телевизор","Посмотреть телевизор?",[
    {label:"Посмотреть",action:()=>{
     happy=Math.min(100,happy+15);
     say("Ты посмотрел телевизор.");updateHUD();closeModal();
    }}
   ]);
   return;
  }

  if(Math.hypot(x-4,z-4)<2.5){
   openModal("🍳 Кухня","Ты на кухне.",[
    {label:"Приготовить еду",action:()=>{
     if(spend(50)){
      hunger=Math.min(100,hunger+30);
      say("Ты приготовил обед!");updateHUD();
     }
     closeModal();
    }}
   ]);
   return;
  }

  if(z>5.5){
   leaveHome();return;
  }

  say("Рядом нет мебели для взаимодействия.");
  return;
 }

 let nearest=null,best=Infinity;
 for(const b of buildings){
  const d=Math.hypot(player.position.x-b.x,player.position.z-b.z);
  if(d<best){best=d;nearest=b}
 }
 if(best>9){say("Подойди ближе к зданию.");return}

 if(nearest.name==="Дом"){
  enterHome();return;
 }
 if(nearest.name==="Ратуша"){
  openModal("🏛 Ратуша","Помоги деревне! Награда — 150 ₽.",[
   {label:"Выполнить задание",action:()=>{
    if(!questDone){
     money+=150;questDone=true;
     say("Задание выполнено! +150 ₽");updateHUD();
    }else say("Задание уже выполнено.");
    closeModal();
   }}
  ]);
  return;
 }
 if(nearest.name==="Магазин"){shop();return}
 if(nearest.name==="Казино"){casino();return}
};

// -------------------------
// АНИМАЦИЯ И КАМЕРА
// -------------------------

const clock=new THREE.Clock();

function animate(){
 requestAnimationFrame(animate);
 const dt=Math.min(clock.getDelta(),.05);

 let dx=joyX+(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0);
 let dz=joyY+(keys.s||keys.arrowdown?1:0)-(keys.w||keys.arrowup?1:0);
 const length=Math.hypot(dx,dz);
 if(length>1){dx/=length;dz/=length}

 const moving=length>.08;

 if(moving){
  player.position.x+=dx*7*dt;
  player.position.z+=dz*7*dt;
  player.rotation.y=Math.atan2(dx,dz);
  energy=Math.max(0,energy-.35*dt);

  const swing=Math.sin(performance.now()*.012)*.65;
  leftLeg.rotation.x=swing;
  rightLeg.rotation.x=-swing;
  leftArm.rotation.x=-swing*.65;
  rightArm.rotation.x=swing*.65;
 }else{
  leftLeg.rotation.x*=.8;
  rightLeg.rotation.x*=.8;
  leftArm.rotation.x*=.8;
  rightArm.rotation.x*=.8;
 }

 if(indoors){
  player.position.x=THREE.MathUtils.clamp(player.position.x,92,108);
  player.position.z=THREE.MathUtils.clamp(player.position.z,92,108);
 }else{
  player.position.x=THREE.MathUtils.clamp(player.position.x,-53,53);
  player.position.z=THREE.MathUtils.clamp(player.position.z,-53,53);
 }

 const target=new THREE.Vector3(
  player.position.x,
  player.position.y+5,
  player.position.z+8
 );
 camera.position.lerp(target,1-Math.pow(.001,dt));
 camera.lookAt(player.position.x,player.position.y+1.3,player.position.z);

 updateHUD();
 renderer.render(scene,camera);
}
animate();

// Расход голода
setInterval(()=>{
 hunger=Math.max(0,hunger-.3);
 if(hunger===0)energy=Math.max(0,energy-1);
 updateHUD();
},5000);

// Начальное положение камеры
camera.position.set(0,6,13);
camera.lookAt(0,1,5);

window.addEventListener("resize",()=>{
 camera.aspect=innerWidth/innerHeight;
 camera.updateProjectionMatrix();
 renderer.setSize(innerWidth,innerHeight);
});

homeInterior.visible=false;
updateHUD();
</script>
</body>
</html>
